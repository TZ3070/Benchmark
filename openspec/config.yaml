schema: spec-driven

context: |
  项目目标：基于 LiteLLM PostgreSQL SpendLogs 实现历史请求定时回放工具。
  用户按源模型和 [开始时间, 结束时间) 选择记录，以 SpendLogs.startTime 的时间间隔
  经 LiteLLM 向独立选择的目标模型发起请求，不等待前序请求完成。
  类 Prometheus 图表使用带模型标签的 LiteLLM 指标，横轴为时间、纵轴为指标值，
  仅用于按源模型浏览和选择回放时间范围。
  工具仅展示运行状态和已发送请求数；性能结果由 LiteLLM 产生和记录，不由工具比较或报告。
  LiteLLM 必须启用 general_settings.store_prompts_in_spend_logs 才能保存新请求内容；
  具体数据库 schema、请求类型和 Prometheus 指标标签需在实现前核验。

rules:
  proposal:
    - 说明变更的用户价值、范围、非目标和风险。
    - 将需要现场核验的 LiteLLM 数据库字段和 Prometheus 指标标为待确认，不得臆造。
  specs:
    - 使用 SHALL/MUST 表达可验收要求。
    - 明确时间语义、请求关联、失败处理和数据敏感性。
  design:
    - 记录关键架构决策、数据流、故障处理及安全边界。
  tasks:
    - 任务应可独立实现和验证，并引用对应规格。
