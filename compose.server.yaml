services:
  benchmark:
    # Starts only this replay API; load the prebuilt image on offline servers.
    image: benchmark-replay:offline
    restart: unless-stopped
    ports:
      # Localhost binding avoids exposing the unauthenticated API directly.
      - "127.0.0.1:${BENCHMARK_HOST_PORT:-8088}:8088"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # The container listens on all interfaces; published host port stays loopback-only.
      BENCHMARK_HOST: "0.0.0.0"
      BENCHMARK_PORT: "8088"
      BENCHMARK_API_KEY: ${BENCHMARK_API_KEY:?set BENCHMARK_API_KEY in .env}
      LITELLM_URL: ${LITELLM_URL:-http://host.docker.internal:4000}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      POSTGRES_HOST: ${POSTGRES_HOST:-host.docker.internal}
      POSTGRES_PORT: ${POSTGRES_PORT:-32100}
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DSN: ${POSTGRES_DSN:-}
      SPENDLOGS_JSONL: /data/spendlogs
      SPENDLOGS_MANIFEST: ${SPENDLOGS_MANIFEST:-}
      BENCHMARK_MAX_WORKERS: ${BENCHMARK_MAX_WORKERS:-128}
      BENCHMARK_RESPONSE_READ_TIMEOUT: ${BENCHMARK_RESPONSE_READ_TIMEOUT:-600}
      BENCHMARK_STATE_DB: /data/state/benchmark.sqlite3
    volumes:
      # Historical SpendLogs snapshots are read-only input to replay.
      - ${SPENDLOGS_ARCHIVE_HOST:-./data/spendlogs}:/data/spendlogs:ro
      # Task and idempotency records survive container rebuilds/restarts.
      - ${BENCHMARK_STATE_HOST:?set BENCHMARK_STATE_HOST in .env}:/data/state
